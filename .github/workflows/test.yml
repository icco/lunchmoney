name: Test Go
on:
  - push
jobs:
  build:
    strategy:
      matrix:
        go:
          - "1.23.x"
          - "1.24.x"
          - "1.25.x"
          - "1.26.x"
          - "1.27.x"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -v ./...
      - name: Test with the Go CLI
        run: go test -v ./...
